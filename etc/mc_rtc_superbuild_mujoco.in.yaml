---
# mc_mujoco variant of the superbuild mc_rtc configuration.
#
# Applied automatically: the `mc_mujoco` on PATH after sourcing setup_mc_rtc.sh
# is a shim (libexec/launchers/mc_mujoco) that prepends this file and execs the
# real binary. Just run `mc_mujoco`.
#
# By hand, if you bypass the shim -- MC_RTC_CONTROLLER_CONFIG applies its entries
# last-to-first, so the first entry wins:
#
#   MC_RTC_CONTROLLER_CONFIG=@CMAKE_INSTALL_PREFIX@/etc/mc_rtc_superbuild_mujoco.yaml:$MC_RTC_CONTROLLER_CONFIG mc_mujoco
#
# mc_rtc_ticker has no shim on purpose: it wants the base configuration (RHPS1,
# Timestep 0.005, i.e. the real robot's), so it is already right.
#
# Everything else -- module paths, plugins, LoadUserConfiguration -- still
# comes from mc_rtc_superbuild.yaml, so the two cannot drift apart. Only what
# is genuinely simulation-specific lives here.
#
# MainRobot: mc_mujoco has no model registered for the real RHPS1 module, and
# the RHPS1_MuJoCo branch of the module lists the 30 driven joints directly.
MainRobot: RHPS1_MuJoCo

# Timestep: the SAME 0.005 as the real robot (imposed there by RobotHardware.conf
# and hard-checked by mc_openrtm). Simulation is not bound by it, and used to run
# at 1 kHz -- that was the whole problem. mjlab trains at 200 Hz too (sim dt
# 0.0025, decimation 2), so 1 kHz made mc_mujoco the only one of the three at a
# different control rate, and it hid on this machine everything that then showed
# up on hardware.
#
# Physics stays at 1 kHz: mc_mujoco computes frameskip = round(mc_rtc timestep /
# XML timestep) = 5 and interpolates the reference across the window
# (mj_sim.cpp:671, 814), so the servo still runs at 1 kHz and kd*dt stays 0.4.
# Only the control loop slows to the rate the robot and training both use.
Timestep: 0.005

# posture_stiffness. Read this before trusting the number.
#
# Until 2026-08-24 this key did nothing at all: a non-const postureStiffness()
# overload in NewRLQPController shadowed the config-reading one and won every
# call, so the task always ran the bare formula 0.2/(policyDt*Timestep) -- 8000
# at 5 ms, 40000 back when this file said 1 kHz. Here AND on the robot. So
# "1600 is also the robot's value", which this comment used to say, was never
# true: both plants ran 8000, matching each other while matching neither this
# file. Fixed in rl_controller 2513f93.
#
# The argument for 1600 is unchanged and still sound: the formula scales K as
# 1/dt, but holding the discrete-stability margin sqrt(K)*dt fixed needs 1/dt^2.
# At 1 ms the two coincide (40000, margin 0.20); at 5 ms the formula gives 8000
# and the margin slips to 0.447, past what it targets. 1600 restores 0.20.
# That makes it a well-motivated hypothesis -- nothing has ever walked on it.
#
# MEASURED 2026-08-24, the first time the key worked. One mc_mujoco session,
# policy 0, walking, 8000 then 1600 with a disarm between:
#
#                        K=8000   K=1600
#   lag q_rl->qIn (ms)     52.5     59.7    +14%   (normalised by qd*)
#   q_rl - qOut (mrad)      9.47    12.50   +32%   the QP stage
#   qOut - qIn  (mrad)      1.12     1.13    +1%   the servo, untouched
#   |tau| max (N.m)        99.3    115.6    +16%
#
# 1600 is worse on every axis that matters and buys nothing. Keep 8000, which
# is what every block already declares.
#
# The interesting part is the size of the change, not its sign. Dividing K by 5
# should move the task's own 1/sqrt(K) lag from 11 to 25 ms, i.e. +26% of a
# 52 ms total; it moved +14%. So most of those 52 ms are NOT the stiffness --
# they are the QP's constraint set and the whole-body dynamics, which no gain
# recovers. The 2026-08-17 note in NewRLQPController.yaml made exactly this
# objection (a coupled QP is not a decoupled per-joint oscillator) and it turns
# out to be the right one: sqrt(K)*dt = 0.447 is evidently stable here, and the
# margin argument was about numerical stability, not about tracking.
#
# The lever left is not on this side. If the lag cannot be removed, train
# against it -- FiniteDifferencePdActuator's posture filter, Task B of the plan.
posture_stiffness: 1600
