---
# Superbuild-owned mc_rtc configuration.
#
# Why this file exists, and why it is not etc/mc_rtc.yaml: mc_rtc merges its
# global configuration in this order, each layer overriding the previous one
# (mc_global_controller_configuration.cpp):
#
#   1. ${CMAKE_INSTALL_PREFIX}/etc/mc_rtc.yaml   -- mc_rtc's own, it installs it
#   2. every file in $MC_RTC_CONTROLLER_CONFIG   -- this file
#   3. ~/.config/mc_rtc/mc_rtc.yaml              -- the user's, if LoadUserConfiguration
#   4. whatever is passed explicitly with -f
#
# Layer 1 is out: mc_rtc already installs a file at that exact path, so ours
# would collide and be clobbered on any mc_rtc rebuild. Layer 2 is ours alone,
# and setup_mc_rtc.sh points MC_RTC_CONTROLLER_CONFIG at it.
#
# LoadUserConfiguration: false is the point of the exercise. A stale
# ~/.config/mc_rtc/mc_rtc.yaml silently overrides everything the build
# installed -- which is exactly what happened on the PPC, whose mc_rtc was a
# different version with a different config than this workstation's. That layer
# is switched off here, so what you build is what runs, for mc_rtc_ticker and
# mc_mujoco alike. The flag is read *after* this file is merged, so setting it
# here works. To get the old behaviour back for a one-off, run with
# `-f /path/to/other.yaml` (layer 4) rather than editing this.
LoadUserConfiguration: false

# The real robot's control loop: RobotHardware.conf sets rate 200 / dt 0.005
# (io_main itself cycles at 1kHz, RHPS1.conf period 0.001). mc_openrtm
# error_and_throw's if this does not match the IOB period exactly, so the
# controller will not start at all if this drifts. mc_mujoco overrides it.
Timestep: 0.005

# Ecrire le log depuis un thread separe plutot que depuis run(). Sur le run du
# 2026-08-06, perf_Log culminait a 81.5 ms et perf_GlobalRun a 82.3 ms pour un
# budget de 5 ms, alors que le solveur ne depassait jamais 1.83 ms : les pics
# venaient de l'ecriture disque. mc_rtc recommande cette politique sur systeme
# temps reel. Contrepartie : sur un arret brutal, la fin du log peut manquer.
LogPolicy: threaded

# RHPS1, not RHPS1_MuJoCo: this is the real-robot entry point. The module's
# non-mujoco branch lists 32 joints (L_HAND/R_HAND on top of the 30 driven
# ones); NewRLQPController filters refJointOrder down to the 1-DoF joints the
# robot actually carries, so the 30-key q0/kp/kd blocks in the controller yaml
# still match.
MainRobot: RHPS1
Enabled: NewRLQPController

Plugins:
  - mc_joystick_plugin

ObserverModulePaths:
  - "@CMAKE_INSTALL_PREFIX@/lib/mc_observers"
RobotModulePaths:
  - "@CMAKE_INSTALL_PREFIX@/lib/mc_robots"
ControllerModulePaths:
  - "@CMAKE_INSTALL_PREFIX@/lib/mc_controller"

# PostureTask stiffness under the QP. Tuned on the robot on 2026-08-07: 1600
# tracks noticeably better than the 8000 the controller derived from
# 0.2/(policy_step_size*Timestep) at 200 Hz.
#
# It lives here rather than in NewRLQPController.yaml on purpose: mc_rtc uses
# the global configuration as the base for a controller config and lets the
# controller yaml override it, so keeping the key out of the controller yaml is
# what lets this file and the mujoco overlay carry different values.
posture_stiffness: 1600
