name: CI macOS

# Fork: disabled. Only Ubuntu Noble is exercised here -- this fork targets one
# robot PC. Trigger reduced to workflow_dispatch rather than deleting the file,
# so merging upstream does not conflict and re-enabling is one line.
on:
  workflow_dispatch:

# cancel running workflows when pushing to the same branch/pr
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Bootstrap
      shell: bash
      run: |
        ./utils/bootstrap-macos.sh
    - name: Install system dependencies
      shell: bash
      run: |
        mkdir -p ${TMPDIR-/tmp}/build-mc-rtc
        cmake -S ${GITHUB_WORKSPACE} -B ${TMPDIR-/tmp}/build-mc-rtc -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVERBOSE_TEST_OUTPUT=ON -DMC_RTC_SUPERBUILD_VERBOSE=ON
    - name: Install mc_rtc and related projects
      shell: bash
      run: |
        cmake --build ${TMPDIR-/tmp}/build-mc-rtc --config RelWithDebInfo
